# See https://pre-commit.com/#pre-commit-config.yaml for more information

default_install_hook_types:
- pre-commit
- pre-push
default_stages:
- pre-commit
- pre-push

repos:

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:

  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files
    args: ["--maxkb=800"]
  - id: check-json
  - id: check-toml
  - id: check-merge-conflict
  - id: debug-statements

- repo: local
  hooks:
  - id: validate-registry-schema
    name: Validate registry.yaml schema
    entry: python scripts/validate_registry.py
    language: python
    files: ^skills/registry\.yaml$
    types: [yaml]
    additional_dependencies:
    - pyyaml
    - jsonschema

  - id: validate-skills-registered
    name: Validate all skills are registered
    entry: python scripts/validate_skills_registered.py
    language: python
    files: ^skills/
    types: [directory]
    always_run: true
    additional_dependencies:
    - pyyaml

- repo: https://github.com/hukkin/mdformat
  rev: 0.7.22
  hooks:

  - id: mdformat
    additional_dependencies:

    # Core extensions

    - mdformat-gfm # GitHub Flavored Markdown (tables, strikethrough, etc.)
    - mdformat-frontmatter # YAML/TOML front matter support

    # Additional markdown syntax support

    - mdformat-footnote # Pandoc-style footnotes
    - mdformat-deflist # Pandoc-style definition lists
    - mdformat-toc # Table-of-contents extension

    # Code formatters

    - mdformat-black # Python code formatting
    - mdformat-web # JavaScript, CSS, HTML, XML
    - mdformat-config # YAML, TOML, INI, config files
